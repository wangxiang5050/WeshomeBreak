name: WeshomeBreak
options:
  bundleIdPrefix: com.weshome
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GrillBreakCore:
    path: ../GrillBreakCore
targets:
  WeshomeBreak:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Weshome Break
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Sources/WeshomeBreak.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weshome.break
        PRODUCT_MODULE_NAME: WeshomeBreak
        PRODUCT_NAME: "Weshome Break"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Sources/WeshomeBreak.entitlements
    dependencies:
      - package: GrillBreakCore
    scheme:
      testTargets:
        - WeshomeBreakTests
  WeshomeBreakTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weshome.break.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Weshome Break.app/Contents/MacOS/Weshome Break"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: WeshomeBreak
